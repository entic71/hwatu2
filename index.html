<script>
function showError(msg){
  const el = document.getElementById("errorBanner");
  el.style.display = "block";
  el.innerText = "⚠ " + msg;
}
function clearError(){
  const el = document.getElementById("errorBanner");
  el.style.display = "none";
  el.innerText = "";
}
if(typeof firebase === "undefined"){
  window.addEventListener("DOMContentLoaded", () => showError("Firebase 라이브러리를 불러오지 못했습니다. 네트워크(방화벽/광고차단 확장)를 확인한 뒤 새로고침 해주세요."));
}
const firebaseConfig = {
  apiKey: "AIzaSyDfTOFchRqnH1ifrwgJ-F--qdzRGecs0Q8",
  authDomain: "bacarat-5e575.firebaseapp.com",
  databaseURL: "https://bacarat-5e575-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "bacarat-5e575",
  storageBucket: "bacarat-5e575.firebasestorage.app",
  messagingSenderId: "805374159280",
  appId: "1:805374159280:web:7b4d1bd628b29341ee4e75"
};
let db = null;
try{
  firebase.initializeApp(firebaseConfig);
  db = firebase.database();
}catch(err){
  showError("Firebase 초기화 실패: " + err.message);
}
let player = "";
let room   = "";
function buildDeck(){
  const deck = [];
  for(let n = 1; n <= 10; n++){
    deck.push(String(n));
    deck.push(String(n) + ".");
  }
  return deck;
}
function shuffle(a){
  const arr = a.slice();
  for(let i = arr.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    const tmp = arr[i];
    arr[i] = arr[j];
    arr[j] = tmp;
  }
  return arr;
}
async function createRoom(){
  clearError();
  player = document.getElementById("name").value.trim();
  if(!player) return alert("닉네임을 입력해주세요.");
  room = Math.random().toString(36).substring(2,6).toUpperCase();
  try{
    await db.ref("rooms/"+room).set(freshRoomState());
    await joinCore();
  }catch(err){
    showError("방 생성 실패: " + err.message);
  }
}
async function joinRoom(){
  clearError();
  player = document.getElementById("name").value.trim();
  room   = document.getElementById("roomInput").value.trim().toUpperCase();
  if(!player) return alert("닉네임을 입력해주세요.");
  if(!room)   return alert("방 코드를 입력해주세요.");
  try{
    const snap = await db.ref("rooms/"+room).once("value");
    if(!snap.exists()) return alert("존재하지 않는 방 코드입니다.");
    await joinCore();
  }catch(err){
    showError("방 입장 실패: " + err.message);
  }
}
async function joinCore(){
  try{
    const playerRef = db.ref("rooms/"+room+"/players/"+player);
    const existing = await playerRef.once("value");
    if(existing.exists()){
      alert("이미 사용 중인 닉네임입니다. 다른 닉네임으로 입장해주세요.");
      return;
    }
    await playerRef.set({ cards:[], score:0, hasDrawn:false });
    playerRef.onDisconnect().remove();
    document.getElementById("authBox").style.display = "none";
    document.getElementById("roomCode").innerText     = "방 코드: " + room;
    document.getElementById("lobby").style.display    = "block";
    listen();
  }catch(err){
    showError("입장 처리 중 오류: " + err.message);
  }
}
function freshRoomState(){
  return {
    players: {},
    deck: shuffle(buildDeck()),
    started: false,
    turn: null,
    phase: "drawing",
    pot: 0,
    currentBet: 0,
    bettor: null,
    pendingRaise: 0,
    raiseBy: null,
    revealed: false,
    contrib: {}
  };
}
async function startGame(){
  clearError();
  const btn = document.getElementById("startBtn");
  btn.disabled = true;
  try{
    const s = await db.ref("rooms/"+room+"/players").once("value");
    if(!s.exists() || s.numChildren() < 2){
      alert("최소 2명이 필요합니다.");
      return;
    }
    const playersVal = s.val();
    const first = Object.keys(playersVal)[0];
    await db.ref("rooms/"+room).update({
      started: true,
      turn: first,
      phase: "drawing",
      pot: 0, currentBet: 0,
      bettor: null, pendingRaise: 0, raiseBy: null,
      revealed: false,
      contrib: {},
      deck: shuffle(buildDeck())
    });
    const resetUpdates = {};
    for(let p in playersVal){
      resetUpdates["players/"+p+"/hasDrawn"] = false;
      resetUpdates["players/"+p+"/cards"]    = [];
    }
    await db.ref("rooms/"+room).update(resetUpdates);
  }catch(err){
    showError("게임 시작 실패: " + err.message + " (Firebase 규칙/네트워크를 확인해보세요)");
  }finally{
    btn.disabled = false;
  }
}
async function draw(){
  clearError();
  const roomRef = db.ref("rooms/"+room);
  try{
    const snap = await roomRef.once("value");
    const data = snap.val();
    if(!data) return showError("방 정보를 불러오지 못했습니다.");
    if(data.phase !== "drawing")   return alert("지금은 카드를 뽑을 수 없습니다.");
    if(data.turn !== player)       return alert("내 턴이 아닙니다.");
    if((data.players[player]||{}).hasDrawn) return alert("이미 뽑았습니다.");
    const deckRef    = db.ref("rooms/"+room+"/deck");
    const myCardsRef = db.ref("rooms/"+room+"/players/"+player+"/cards");
    const heldCards  = data.players[player].cards || [];
    const step1 = await deckRef.transaction(deck => shuffle([...(deck||[]), ...heldCards]));
    if(!step1.committed) return showError("덱 반납 실패, 다시 시도해주세요.");
    let drawn = null;
    const step2 = await deckRef.transaction(deck => {
      if(!deck || deck.length < 2) return deck;
      const copy = deck.slice();
      drawn = copy.splice(0, 2);
      return copy;
    });
    if(!step2.committed || !drawn) return showError("덱에 카드가 부족합니다.");
    await myCardsRef.set(drawn);
    await db.ref("rooms/"+room+"/players/"+player+"/hasDrawn").set(true);
    const players    = data.players;
    const otherName  = Object.keys(players).find(p => p !== player);
    const otherDrawn = players[otherName] && players[otherName].hasDrawn;
    if(otherDrawn){
      await db.ref("rooms/"+room).update({ phase: "betting", bettor: null, currentBet: 0 });
    } else if(otherName){
      await db.ref("rooms/"+room+"/turn").set(otherName);
    }
  }catch(err){
    showError("카드 뽑기 실패: " + err.message);
  }
}
async function placeBet(){
  clearError();
  const amount = parseInt(document.getElementById("betInput").value, 10);
  if(!amount || amount <= 0) return alert("금액을 입력해주세요.");
  document.getElementById("betInput").value = "";
  try{
    const snap = await db.ref("rooms/"+room).once("value");
    const data = snap.val();
    if(data.phase !== "betting") return alert("지금은 베팅할 수 없습니다.");
    const betUpdates = { pot: (data.pot||0) + amount, currentBet: amount, bettor: player };
    betUpdates["contrib/"+player] = amount;
    await db.ref("rooms/"+room).update(betUpdates);
  }catch(err){
    showError("베팅 실패: " + err.message);
  }
}
async function requestRaise(){
  clearError();
  const amount = parseInt(document.getElementById("raiseInput").value, 10);
  if(!amount || amount <= 0) return alert("레이즈 금액을 입력해주세요.");
  document.getElementById("raiseInput").value = "";
  try{
    const snap = await db.ref("rooms/"+room).once("value");
    const data = snap.val();
    if(data.phase !== "betting") return alert("지금은 레이즈할 수 없습니다.");
    if(data.bettor === player) return alert("자신의 베팅에 레이즈할 수 없습니다.");
    if(amount <= (data.currentBet||0)){
      return alert("레이즈 금액은 현재 베팅(" + (data.currentBet||0).toLocaleString() + "원)보다 커야 합니다.");
    }
    await db.ref("rooms/"+room).update({
      phase: "raise_pending",
      pendingRaise: amount,
      raiseBy: player
    });
  }catch(err){
    showError("레이즈 요청 실패: " + err.message);
  }
}
async function acceptRaise(){
  clearError();
  try{
    const snap = await db.ref("rooms/"+room).once("value");
    const data = snap.val();
    if(data.phase !== "raise_pending") return;
    if(data.raiseBy === player) return alert("자신의 레이즈에 동의할 수 없습니다.");
    const contrib = data.contrib || {};
    const raiserPaid = contrib[data.raiseBy] || 0;
    const needed = Math.max(0, (data.pendingRaise||0) - raiserPaid);
    const acceptUpdates = {
      pot: (data.pot||0) + needed,
      currentBet: data.pendingRaise,
      bettor: data.raiseBy,
      pendingRaise: 0,
      raiseBy: null,
      phase: "betting"
    };
    acceptUpdates["contrib/"+data.raiseBy] = raiserPaid + needed;
    await db.ref("rooms/"+room).update(acceptUpdates);
  }catch(err){
    showError("레이즈 동의 실패: " + err.message);
  }
}
async function rejectRaise(){
  clearError();
  try{
    const snap = await db.ref("rooms/"+room).once("value");
    const data = snap.val();
    if(data.phase !== "raise_pending") return;
    if(data.raiseBy === player) return alert("자신의 레이즈를 거절할 수 없습니다.");
    await awardPot(data.raiseBy, data.pot||0);
  }catch(err){
    showError("레이즈 거절 실패: " + err.message);
  }
}
async function call(){
  clearError();
  try{
    const snap = await db.ref("rooms/"+room).once("value");
    const data = snap.val();
    if(data.phase !== "betting") return alert("지금은 콜할 수 없습니다.");
    if(!data.bettor) return alert("아직 베팅이 없습니다.");
    if(data.bettor === player) return alert("자신의 베팅에 콜할 수 없습니다.");
    const contrib  = data.contrib || {};
    const myPaid   = contrib[player] || 0;
    const needed   = Math.max(0, (data.currentBet||0) - myPaid);
    const callUpdates = { pot: (data.pot||0) + needed, phase: "waiting_result", revealed: true };
    callUpdates["contrib/"+player] = myPaid + needed;
    await db.ref("rooms/"+room).update(callUpdates);
  }catch(err){
    showError("콜 실패: " + err.message);
  }
}
async function die(){
  clearError();
  try{
    const snap = await db.ref("rooms/"+room).once("value");
    const data = snap.val();
    if(data.phase !== "betting") return alert("지금은 다이할 수 없습니다.");
    if(!data.bettor) return alert("아직 베팅이 없습니다.");
    if(data.bettor === player) return alert("자신의 베팅에 다이할 수 없습니다.");
    await awardPot(data.bettor, data.pot||0);
  }catch(err){
    showError("다이 실패: " + err.message);
  }
}
async function finishRound(iWon){
  clearError();
  try{
    const snap = await db.ref("rooms/"+room).once("value");
    const data    = snap.val();
    const players = Object.keys(data.players);
    const winner  = iWon ? player : players.find(p => p !== player);
    await awardPot(winner, data.pot||0);
  }catch(err){
    showError("정산 실패: " + err.message);
  }
}
async function awardPot(winner, amount){
  try{
    const snap = await db.ref("rooms/"+room).once("value");
    const data    = snap.val();
    const players = data.players;
    const loser   = Object.keys(players).find(p => p !== winner);
    const updates = {
      pot:          0,
      currentBet:   0,
      bettor:       null,
      pendingRaise: 0,
      raiseBy:      null,
      revealed:     false,
      contrib:      {},
      phase:        "drawing",
      turn:         winner,
      deck:         shuffle(buildDeck())
    };
    updates["players/"+winner+"/score"]    = (players[winner].score||0) + amount;
    updates["players/"+loser+"/score"]     = (players[loser].score||0)  - amount;
    updates["players/"+winner+"/cards"]    = [];
    updates["players/"+loser+"/cards"]     = [];
    updates["players/"+winner+"/hasDrawn"] = false;
    updates["players/"+loser+"/hasDrawn"]  = false;
    await db.ref("rooms/"+room).update(updates);
  }catch(err){
    showError("정산 처리 실패: " + err.message);
  }
}
function renderCards(list, targetId, hide){
  const el = document.getElementById(targetId);
  el.innerHTML = "";
  (list||[]).forEach(c => {
    const isSpecial = String(c).endsWith(".");
    const d = document.createElement("div");
    if(hide){
      d.style.cssText = "width:60px;height:92px;border-radius:10px;background:oklch(0.27 0.02 25);border:1px solid oklch(1 0 0/0.08);box-shadow:0 2px 8px rgba(0,0,0,.3);animation:dealIn .3s ease;";
    } else {
      d.style.cssText = "width:60px;height:92px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:oklch(0.93 0.02 85);color:oklch(0.2 0.01 85);font-weight:700;font-size:19px;font-family:'Noto Sans KR',sans-serif;border:1px solid rgba(0,0,0,.08);box-shadow:0 2px 8px rgba(0,0,0,.22);position:relative;animation:dealIn .3s ease;";
      d.innerText = c;
      if(isSpecial){
        const badge = document.createElement("span");
        badge.style.cssText = "position:absolute;top:6px;right:6px;width:7px;height:7px;border-radius:50%;background:oklch(0.78 0.11 75);";
        d.appendChild(badge);
      }
    }
    el.appendChild(d);
  });
}
function renderScores(players){
  let html = "";
  for(let p in players){
    const score = players[p].score || 0;
    let color = "oklch(0.85 0.005 260)", sign = "";
    if(score > 0){ color = "oklch(0.68 0.13 155)"; sign = "+"; }
    else if(score < 0){ color = "oklch(0.62 0.17 25)"; }
    html += '<div style="background:oklch(0.20 0.005 260);border:1px solid oklch(1 0 0/0.08);border-radius:12px;padding:12px 18px;min-width:120px;">' +
      '<div style="font-size:12px;color:oklch(0.6 0.01 260);margin-bottom:5px;">' + p + (p===player?" (나)":"") + '</div>' +
      '<div style="font-size:20px;font-weight:700;color:' + color + ';">' + sign + score.toLocaleString() + '원</div>' +
    '</div>';
  }
  document.getElementById("scoreBoard").innerHTML = html;
}
function showUI(data){
  const ids = ["ui-drawing","ui-bet-input","ui-respond","ui-raise-wait","ui-raise-ask","ui-result"];
  ids.forEach(id => document.getElementById(id).style.display = "none");
  const phase  = data.phase  || "drawing";
  const bettor = data.bettor || null;
  if(phase === "drawing"){
    const myData    = (data.players||{})[player] || {};
    const myTurn    = data.turn === player;
    const notDrawn  = !myData.hasDrawn;
    if(myTurn && notDrawn){
      document.getElementById("ui-drawing").style.display = "block";
    }
  } else if(phase === "betting"){
    if(!bettor){
      document.getElementById("ui-bet-input").style.display = "block";
    } else if(bettor === player){
    } else {
      document.getElementById("ui-respond").style.display = "block";
    }
  } else if(phase === "raise_pending"){
    if(data.raiseBy === player){
      document.getElementById("ui-raise-wait").style.display = "block";
    } else {
      document.getElementById("ui-raise-ask").style.display = "block";
      document.getElementById("raiseAskText").innerText =
        "상대가 " + (data.pendingRaise||0).toLocaleString() + "원을 더 올리자고 합니다!";
    }
  } else if(phase === "waiting_result"){
    document.getElementById("ui-result").style.display = "block";
  }
}
function updateStatus(data){
  const phase = data.phase || "drawing";
  let msg = "";
  if(phase === "drawing"){
    const myDrawn    = (data.players[player]||{}).hasDrawn;
    const otherName  = Object.keys(data.players).find(p=>p!==player);
    const otherDrawn = otherName && (data.players[otherName]||{}).hasDrawn;
    if(myDrawn && !otherDrawn)      msg = "상대방이 카드를 뽑는 중...";
    else if(!myDrawn && otherDrawn) msg = "내 차례입니다. 카드를 뽑으세요.";
    else if(!myDrawn)               msg = data.turn===player ? "먼저 카드를 뽑으세요." : "상대방이 먼저 뽑는 중...";
    else                            msg = "둘 다 뽑음 — 베팅을 시작하세요.";
  } else if(phase === "betting"){
    if(!data.bettor)              msg = "베팅하거나 상대가 베팅하길 기다리세요.";
    else if(data.bettor===player) msg = "상대방의 반응을 기다리는 중...";
    else                          msg = "콜, 다이, 또는 레이즈를 선택하세요.";
  } else if(phase === "raise_pending"){
    msg = data.raiseBy===player ? "상대방의 레이즈 동의를 기다리는 중..." : "레이즈에 동의하시겠습니까?";
  } else if(phase === "waiting_result"){
    msg = "카드 공개! 대화로 정하고 승자를 선택하세요.";
  }
  document.getElementById("statusText").innerText = msg;
}
function listen(){
  const roomRef = db.ref("rooms/"+room);
  roomRef.child("started").on("value", snap => {
    if(snap.val() === true){
      document.getElementById("lobby").style.display = "none";
      document.getElementById("game").style.display  = "block";
    }
  }, err => showError("연결 오류: " + err.message));
  roomRef.on("value", snap => {
    const data = snap.val();
    if(!data) return;
    const players  = data.players || {};
    const revealed = data.revealed === true;
    let lobbyHtml = "";
    for(let p in players) lobbyHtml += '<div style="display:flex;align-items:center;justify-content:space-between;background:oklch(0.20 0.005 260);border:1px solid oklch(1 0 0/0.08);border-radius:10px;padding:12px 16px;margin:6px 0;font-size:14px;"><span>' + p + '</span><span style="width:7px;height:7px;border-radius:50%;background:oklch(0.68 0.13 155);"></span></div>';
    if(Object.keys(players).length < 2)
      lobbyHtml += '<div style="color:oklch(0.55 0.01 260);font-style:italic;padding:12px 16px;font-size:14px;">상대방 입장 대기 중...</div>';
    document.getElementById("lobbyPlayers").innerHTML = lobbyHtml;
    if(!data.started) return;
    for(let p in players){
      if(p === player){
        renderCards(players[p].cards, "myCards", false);
      } else {
        renderCards(players[p].cards, "enemyCards", !revealed);
      }
    }
    document.getElementById("myTag").style.display    = revealed ? "inline-block" : "none";
    document.getElementById("enemyTag").style.display = revealed ? "inline-block" : "none";
    const pot = data.pot || 0;
    const potBox = document.getElementById("potBox");
    if(pot > 0){
      potBox.style.display = "block";
      potBox.innerText = "판돈  " + pot.toLocaleString() + "원";
    } else {
      potBox.style.display = "none";
    }
    renderScores(players);
    updateStatus(data);
    showUI(data);
  }, err => showError("실시간 연결 오류: " + err.message));
}
</script>

    <div style="display:flex;align-items:center;gap:10px;">
      <div style="width:34px;height:34px;border-radius:9px;background:linear-gradient(160deg, oklch(0.78 0.11 75), oklch(0.62 0.1 75));display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;color:oklch(0.18 0.02 75);flex-shrink:0;">섰</div>
      <div style="text-align:left;">
        <div style="font-weight:800;font-size:17px;letter-spacing:0.3px;line-height:1.1;">온라인 섰다</div>
        <div style="font-size:10px;letter-spacing:2px;color:oklch(0.55 0.01 260);text-transform:uppercase;margin-top:2px;">HWATU · SEOTDA</div>
      </div>
    </div>
    <div style="display:flex;align-items:center;gap:6px;font-size:11px;color:oklch(0.6 0.01 260);">
      <span style="width:6px;height:6px;border-radius:50%;background:oklch(0.68 0.13 155);display:inline-block;"></span>
      실시간
    </div>
  </div>

  <div style="padding:24px 16px 0;">

  <div id="errorBanner" style="display:none;background:oklch(0.24 0.05 25);border:1px solid oklch(0.45 0.1 25);color:oklch(0.92 0.02 25);border-radius:12px;padding:14px 16px;margin:10px 0;font-size:13.5px;line-height:1.6;text-align:left;"></div>

  <div id="authBox" style="background:oklch(0.20 0.005 260);border:1px solid oklch(1 0 0/0.08);border-radius:16px;padding:22px 18px;margin:10px 0;">
    <div style="font-size:13px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:oklch(0.62 0.02 260);margin:0 0 16px;">입장</div>
    <input id="name" type="text" placeholder="닉네임" style="width:100%;padding:14px 16px;margin-bottom:10px;border-radius:10px;border:1px solid oklch(1 0 0/0.1);background:oklch(0.12 0.004 260);color:oklch(0.96 0.003 260);font-size:15px;font-family:inherit;outline:none;box-sizing:border-box;" style-focus="border-color:oklch(0.78 0.11 75);box-shadow:0 0 0 3px oklch(0.78 0.11 75 / 0.15);">
    <button onclick="createRoom()" style="width:100%;padding:16px;margin:6px 0;border:none;border-radius:10px;font-size:15px;font-weight:700;font-family:'Noto Sans KR',sans-serif;letter-spacing:0.2px;cursor:pointer;background:oklch(0.68 0.13 155);color:oklch(0.14 0.02 155);box-sizing:border-box;" style-hover="opacity:0.9;">방 만들기</button>
    <hr style="border:0;height:1px;margin:18px 0;background:oklch(1 0 0/0.08);">
    <input id="roomInput" type="text" placeholder="방 코드 4자리" style="width:100%;padding:14px 16px;margin-bottom:10px;border-radius:10px;border:1px solid oklch(1 0 0/0.1);background:oklch(0.12 0.004 260);color:oklch(0.96 0.003 260);font-size:15px;font-family:inherit;outline:none;box-sizing:border-box;" style-focus="border-color:oklch(0.78 0.11 75);box-shadow:0 0 0 3px oklch(0.78 0.11 75 / 0.15);">
    <button onclick="joinRoom()" style="width:100%;padding:16px;margin:6px 0;border:none;border-radius:10px;font-size:15px;font-weight:700;font-family:'Noto Sans KR',sans-serif;letter-spacing:0.2px;cursor:pointer;background:oklch(0.28 0.006 260);color:oklch(0.92 0.005 260);box-sizing:border-box;" style-hover="opacity:0.9;">방 입장하기</button>
  </div>

  <h3 id="roomCode" style="font-size:15px;color:oklch(0.78 0.11 75);letter-spacing:2px;margin:16px 0;font-weight:700;"></h3>

  <div id="lobby" style="display:none;background:oklch(0.20 0.005 260);border:1px solid oklch(1 0 0/0.08);border-radius:16px;padding:22px 18px;margin:10px 0;">
    <div style="font-size:13px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:oklch(0.62 0.02 260);margin:0 0 16px;">참여 플레이어</div>
    <div id="lobbyPlayers"></div>
    <button id="startBtn" onclick="startGame()" style="width:100%;padding:16px;margin:16px 0 0;border:none;border-radius:10px;font-size:15px;font-weight:700;font-family:'Noto Sans KR',sans-serif;letter-spacing:0.2px;cursor:pointer;background:oklch(0.68 0.13 155);color:oklch(0.14 0.02 155);box-sizing:border-box;" style-hover="opacity:0.9;">게임 시작</button>
  </div>

  <div id="game" style="display:none;">

    <div style="background:oklch(0.19 0.006 260);border:1px solid oklch(1 0 0/0.07);border-radius:14px;padding:16px;margin:14px 0;">
      <div style="font-size:11px;letter-spacing:2px;text-transform:uppercase;color:oklch(0.55 0.01 260);margin:0 0 12px;text-align:left;">점수</div>
      <div id="scoreBoard" style="display:flex;justify-content:center;gap:10px;flex-wrap:wrap;"></div>
    </div>

    <div id="potBox" style="display:none;background:linear-gradient(160deg, oklch(0.24 0.03 75 / 0.5), oklch(0.19 0.006 260));border:1px solid oklch(0.78 0.11 75 / 0.4);border-radius:12px;padding:14px;margin:16px 0;font-size:16px;font-weight:700;color:oklch(0.78 0.11 75);letter-spacing:0.5px;animation:fadeIn .3s ease;"></div>
    <p id="statusText" style="font-size:14px;color:oklch(0.6 0.01 260);min-height:20px;margin:6px 0 16px;"></p>

    <div id="ui-drawing" style="display:none;">
      <button onclick="draw()" style="width:100%;padding:16px;margin:6px 0;border:none;border-radius:10px;font-size:15px;font-weight:700;font-family:'Noto Sans KR',sans-serif;letter-spacing:0.2px;cursor:pointer;background:oklch(0.68 0.13 155);color:oklch(0.14 0.02 155);box-sizing:border-box;" style-hover="opacity:0.9;">카드 뽑기</button>
    </div>

    <div style="background:radial-gradient(circle at 50% 0%, oklch(0.24 0.03 155 / 0.35), transparent 70%), oklch(0.16 0.01 155 / 0.4);border:1px solid oklch(1 0 0/0.07);border-radius:16px;padding:18px 14px;margin:18px 0;">
      <div style="display:flex;align-items:center;justify-content:space-between;margin:0 0 8px;">
        <div style="font-size:11px;letter-spacing:2px;text-transform:uppercase;color:oklch(0.55 0.01 260);">내 카드</div>
        <div id="myTag" style="display:none;font-size:10px;color:oklch(0.78 0.11 75);letter-spacing:1.5px;text-transform:uppercase;padding:2px 8px;border:1px solid oklch(0.78 0.11 75 / 0.4);border-radius:20px;">공개됨</div>
      </div>
      <div id="myCards" style="display:flex;justify-content:center;min-height:100px;gap:10px;flex-wrap:wrap;"></div>

      <div style="height:1px;background:oklch(1 0 0/0.08);margin:18px 0;"></div>

      <div style="display:flex;align-items:center;justify-content:space-between;margin:0 0 8px;">
        <div style="font-size:11px;letter-spacing:2px;text-transform:uppercase;color:oklch(0.55 0.01 260);">상대 카드</div>
        <div id="enemyTag" style="display:none;font-size:10px;color:oklch(0.78 0.11 75);letter-spacing:1.5px;text-transform:uppercase;padding:2px 8px;border:1px solid oklch(0.78 0.11 75 / 0.4);border-radius:20px;">공개됨</div>
      </div>
      <div id="enemyCards" style="display:flex;justify-content:center;min-height:100px;gap:10px;flex-wrap:wrap;"></div>
    </div>

    <div id="ui-bet-input" style="display:none;background:oklch(0.20 0.005 260);border:1px solid oklch(1 0 0/0.08);border-radius:16px;padding:22px 18px;margin:16px 0 10px;">
      <div style="font-size:13px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:oklch(0.62 0.02 260);margin:0 0 16px;">베팅</div>
      <input id="betInput" type="number" placeholder="금액 입력" min="1" style="width:100%;padding:14px 16px;margin-bottom:10px;border-radius:10px;border:1px solid oklch(1 0 0/0.1);background:oklch(0.12 0.004 260);color:oklch(0.96 0.003 260);font-size:15px;font-family:inherit;outline:none;box-sizing:border-box;" style-focus="border-color:oklch(0.78 0.11 75);box-shadow:0 0 0 3px oklch(0.78 0.11 75 / 0.15);">
      <button onclick="placeBet()" style="width:100%;padding:16px;margin:6px 0;border:none;border-radius:10px;font-size:15px;font-weight:700;font-family:'Noto Sans KR',sans-serif;letter-spacing:0.2px;cursor:pointer;background:oklch(0.78 0.11 75);color:oklch(0.18 0.02 75);box-sizing:border-box;" style-hover="opacity:0.9;">베팅하기</button>
    </div>

    <div id="ui-respond" style="display:none;background:oklch(0.20 0.005 260);border:1px solid oklch(1 0 0/0.08);border-radius:16px;padding:22px 18px;margin:16px 0 10px;">
      <div style="font-size:13px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:oklch(0.62 0.02 260);margin:0 0 16px;">베팅</div>
      <input id="raiseInput" type="number" placeholder="레이즈 후 총 베팅 금액" min="1" style="width:100%;padding:14px 16px;margin-bottom:10px;border-radius:10px;border:1px solid oklch(1 0 0/0.1);background:oklch(0.12 0.004 260);color:oklch(0.96 0.003 260);font-size:15px;font-family:inherit;outline:none;box-sizing:border-box;" style-focus="border-color:oklch(0.78 0.11 75);box-shadow:0 0 0 3px oklch(0.78 0.11 75 / 0.15);">
      <button onclick="requestRaise()" style="width:100%;padding:16px;margin:6px 0;border:none;border-radius:10px;font-size:15px;font-weight:700;font-family:'Noto Sans KR',sans-serif;letter-spacing:0.2px;cursor:pointer;background:oklch(0.78 0.11 75);color:oklch(0.18 0.02 75);box-sizing:border-box;" style-hover="opacity:0.9;">레이즈 요청</button>
      <div style="display:flex;gap:8px;margin-top:6px;">
        <button onclick="call()" style="flex:1;padding:16px;border:none;border-radius:10px;font-size:15px;font-weight:700;font-family:'Noto Sans KR',sans-serif;cursor:pointer;background:oklch(0.68 0.13 155);color:oklch(0.14 0.02 155);" style-hover="opacity:0.9;">콜</button>
        <button onclick="die()" style="flex:1;padding:16px;border:none;border-radius:10px;font-size:15px;font-weight:700;font-family:'Noto Sans KR',sans-serif;cursor:pointer;background:oklch(0.62 0.17 25);color:oklch(0.97 0.01 25);" style-hover="opacity:0.9;">다이</button>
      </div>
    </div>

    <div id="ui-raise-wait" style="display:none;">
      <p style="color:oklch(0.78 0.11 75);font-size:14.5px;margin:8px 0 16px;line-height:1.5;">상대방의 레이즈 동의를 기다리는 중...</p>
    </div>

    <div id="ui-raise-ask" style="display:none;">
      <p id="raiseAskText" style="color:oklch(0.78 0.11 75);font-size:14.5px;margin:8px 0 16px;line-height:1.5;"></p>
      <div style="display:flex;gap:8px;">
        <button onclick="acceptRaise()" style="flex:1;padding:16px;border:none;border-radius:10px;font-size:15px;font-weight:700;font-family:'Noto Sans KR',sans-serif;cursor:pointer;background:oklch(0.68 0.13 155);color:oklch(0.14 0.02 155);" style-hover="opacity:0.9;">동의 (올리기)</button>
        <button onclick="rejectRaise()" style="flex:1;padding:16px;border:none;border-radius:10px;font-size:15px;font-weight:700;font-family:'Noto Sans KR',sans-serif;cursor:pointer;background:oklch(0.62 0.17 25);color:oklch(0.97 0.01 25);" style-hover="opacity:0.9;">거절 (다이)</button>
      </div>
    </div>

    <div id="ui-result" style="display:none;">
      <p style="color:oklch(0.78 0.11 75);font-size:14.5px;margin:8px 0 16px;line-height:1.5;">카드가 공개됐습니다. 승자를 선택하세요</p>
      <button onclick="finishRound(true)" style="width:100%;padding:16px;margin:6px 0;border:none;border-radius:10px;font-size:15px;font-weight:700;font-family:'Noto Sans KR',sans-serif;cursor:pointer;background:oklch(0.68 0.13 155);color:oklch(0.14 0.02 155);box-sizing:border-box;" style-hover="opacity:0.9;">내가 이겼다</button>
      <button onclick="finishRound(false)" style="width:100%;padding:16px;margin:6px 0;border:none;border-radius:10px;font-size:15px;font-weight:700;font-family:'Noto Sans KR',sans-serif;cursor:pointer;background:oklch(0.28 0.006 260);color:oklch(0.92 0.005 260);box-sizing:border-box;" style-hover="opacity:0.9;">상대가 이겼다</button>
    </div>

  </div>

  <div style="margin:32px 0 0;padding-top:18px;border-top:1px solid oklch(1 0 0/0.06);font-size:11px;letter-spacing:1px;color:oklch(0.42 0.008 260);">화투 · 섰다 — 2인용 온라인 대전</div>
  </div>
</div>
</div>
</x-dc>
</body>
</html>
